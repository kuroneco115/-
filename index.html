<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>かんたんカレンダー</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>かんたんカレンダー</h1>
        <p id="todayText"></p>
      </div>
      <button id="voiceHelp" class="icon-btn" title="音声入力の使い方">🎤</button>
    </header>

    <section class="calendar-card">
      <div class="month-nav">
        <button id="prevMonth" class="nav-btn">‹</button>
        <h2 id="monthTitle"></h2>
        <button id="nextMonth" class="nav-btn">›</button>
      </div>
      <div class="weekdays">
        <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
      </div>
      <div id="calendar" class="calendar-grid"></div>
    </section>

    <section class="selected-card">
      <div class="selected-head">
        <h2 id="selectedTitle"></h2>
        <button id="addBtn" class="primary">＋ 予定を追加</button>
      </div>
      <div id="eventList" class="event-list"></div>
    </section>

    <section class="input-card">
      <label for="quickInput">予定をかんたん入力</label>
      <div class="input-row">
        <input id="quickInput" type="text" placeholder="例：明日の15時に数学">
        <button id="micBtn" class="mic" title="音声入力">🎤</button>
        <button id="quickAdd" class="primary">追加</button>
      </div>
      <p id="voiceStatus" class="status"></p>
      <p class="hint">音声例：「明日の15時に数学」「9月20日 10時 部活」</p>
    </section>

    <footer>
      <button id="todayBtn">今日へ</button>
      <button id="clearBtn">保存データを全削除</button>
    </footer>
  </main>

  <dialog id="eventDialog">
    <form method="dialog" id="eventForm">
      <h2 id="dialogTitle">予定を追加</h2>
      <input type="hidden" id="eventId">
      <label>日付<input id="eventDate" type="date" required></label>
      <label>時間<input id="eventTime" type="time"></label>
      <label>予定<input id="eventTitle" type="text" maxlength="80" placeholder="予定の名前" required></label>
      <label>メモ<textarea id="eventNote" maxlength="300" placeholder="メモ（任意）"></textarea></label>
      <div class="dialog-actions">
        <button type="button" id="deleteEvent" class="danger">削除</button>
        <span></span>
        <button value="cancel">キャンセル</button>
        <button type="submit" value="save" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
